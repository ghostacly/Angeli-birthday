<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Angeli! - by Andre</title>
<style>
:root{color-scheme:dark;--bg1:#1a1440;--bg2:#3b2a6e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#1a1440;overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,dpr,S,ox,oy;
function resize(){
  dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  S=Math.min(W/400,H/560);ox=(W-400*S)/2;oy=(H-560*S)/2;
}
window.addEventListener('resize',resize);resize();

const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.4,p:Math.random()*6}));
const berries=[];
for(let i=0;i<11;i++){const a=Math.PI*2*i/11+.3;berries.push({x:200+Math.cos(a)*88,y:374+Math.sin(a)*13,r:7+(i%3)});}
[[120,432],[160,436],[240,436],[282,432],[200,438]].forEach(p=>berries.push({x:p[0],y:p[1],r:7}));
const drips=[[100,0],[135,1],[170,0],[230,1],[265,0],[300,1]];
let conf=[];
function addConf(n,x,y){
  for(let i=0;i<n;i++)conf.push({x:x??Math.random()*400,y:y??-10,vx:(Math.random()-.5)*(x!=null?160:30),vy:x!=null?-Math.random()*200:30+Math.random()*50,
    w:5+Math.random()*5,h:3+Math.random()*4,a:Math.random()*6,va:(Math.random()-.5)*8,hue:Math.random()*360});
}
addConf(40);
cv.addEventListener('pointerdown',e=>{
  const b=cv.getBoundingClientRect();const lx=(e.clientX-b.left-ox)/S,ly=(e.clientY-b.top-oy)/S;
  if(envTap(lx,ly))return;
  let hit=false;
  CANDLES.forEach((c,i)=>{if(Math.abs(lx-c.x)<34&&ly>(lit[i]?245:285)&&ly<325){hit=true;lit[i]?snuff(i):relight(i);}});
  if(!hit)addConf(30,lx,ly);
});

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function berry(b){
  const g=ctx.createRadialGradient(b.x-b.r*.3,b.y-b.r*.4,1,b.x,b.y,b.r);
  g.addColorStop(0,'#7f8de0');g.addColorStop(.5,'#3d4ba8');g.addColorStop(1,'#1d2260');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(b.x-b.r*.35,b.y-b.r*.4,b.r*.2,0,7);ctx.fill();
  ctx.strokeStyle='#12163f';ctx.lineWidth=1;ctx.beginPath();
  for(let k=0;k<5;k++){const a=k*Math.PI*2/5-Math.PI/2;ctx.moveTo(b.x,b.y+b.r*.1);ctx.lineTo(b.x+Math.cos(a)*b.r*.28,b.y+b.r*.1+Math.sin(a)*b.r*.28);}
  ctx.stroke();
}

function flame(x,y,t,seed){
  const f=1+Math.sin(t*9+seed)*.08+Math.sin(t*17+seed*2)*.05;
  const sway=Math.sin(t*6+seed)*2.5;
  const g=ctx.createRadialGradient(x,y-12,2,x,y-12,55);
  g.addColorStop(0,'rgba(255,200,90,'+(.45*f)+')');g.addColorStop(1,'rgba(255,160,60,0)');
  ctx.fillStyle=g;ctx.fillRect(x-60,y-70,120,120);
  ctx.save();ctx.translate(x,y);ctx.scale(1,f);
  ctx.fillStyle='#ff9a1f';
  ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-11,-4,-8,-18,sway,-30);ctx.bezierCurveTo(8,-18,11,-4,0,0);ctx.fill();
  ctx.fillStyle='#ffe066';
  ctx.beginPath();ctx.moveTo(0,-1);ctx.bezierCurveTo(-6,-4,-4,-12,sway*.6,-20);ctx.bezierCurveTo(4,-12,6,-4,0,-1);ctx.fill();
  ctx.fillStyle='#fffbe0';ctx.beginPath();ctx.ellipse(0,-5,2.2,4,0,0,7);ctx.fill();
  ctx.restore();
}

function rainbowBands(t){
  const cols=['#ff4d6d','#ff9a3c','#ffd93d','#5ddb7a','#4dabf7','#7c6cf0'];
  ctx.lineWidth=7;ctx.lineCap='butt';
  cols.forEach((c,i)=>{
    ctx.strokeStyle=c;ctx.globalAlpha=.32+Math.sin(t*1.5+i)*.06;
    ctx.beginPath();ctx.arc(200,300,204+i*7,Math.PI,0);ctx.stroke();
  });
  ctx.globalAlpha=1;
}

function arcText(txt,t){
  const r=168;ctx.font='900 32px "Arial Black","Trebuchet MS",Verdana,sans-serif';
  const ws=[...txt].map(ch=>ctx.measureText(ch).width+2);
  const total=ws.reduce((a,b)=>a+b,0);
  let a=-Math.PI/2-total/(2*r);
  [...txt].forEach((ch,i)=>{
    const ang=a+ws[i]/(2*r);a+=ws[i]/r;
    const jt=((t-i*.09)%2.6+2.6)%2.6;const rad=r+(jt<.35?Math.sin(jt/.35*Math.PI)*12:0);
    ctx.save();
    ctx.translate(200+Math.cos(ang)*rad,300+Math.sin(ang)*rad);
    ctx.rotate(ang+Math.PI/2);
    ctx.textAlign='center';ctx.textBaseline='alphabetic';
    ctx.lineWidth=5;ctx.strokeStyle='rgba(20,10,60,.7)';ctx.lineJoin='round';ctx.strokeText(ch,0,0);
    ctx.fillStyle='#4dabf7';ctx.fillText(ch,0,0);
    ctx.restore();
  });
}

function cake(t){
  // plate
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(200,520,175,16,0,0,7);ctx.fill();
  let g=ctx.createLinearGradient(0,505,0,525);g.addColorStop(0,'#f3eefc');g.addColorStop(1,'#b9aedb');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(200,512,170,17,0,0,7);ctx.fill();
  // bottom tier
  g=ctx.createLinearGradient(0,430,0,512);g.addColorStop(0,'#8a6bc4');g.addColorStop(1,'#5d438f');
  ctx.fillStyle=g;rr(60,428,280,84,14);ctx.fill();
  // sponge speckles (blueberries inside)
  ctx.fillStyle='rgba(40,40,120,.55)';
  [[90,470],[130,488],[170,462],[215,484],[255,466],[298,490],[320,462],[110,500],[240,502]].forEach(p=>{ctx.beginPath();ctx.ellipse(p[0],p[1],5,4,0,0,7);ctx.fill();});
  // cream layer
  ctx.fillStyle='#f4eefc';rr(60,468,280,9,4);ctx.fill();
  // top tier
  g=ctx.createLinearGradient(0,374,0,430);g.addColorStop(0,'#9a7cd2');g.addColorStop(1,'#6b4fa3');
  ctx.fillStyle=g;rr(92,372,216,62,12);ctx.fill();
  ctx.fillStyle='rgba(40,40,120,.55)';
  [[120,408],[160,420],[205,404],[250,420],[285,406]].forEach(p=>{ctx.beginPath();ctx.ellipse(p[0],p[1],5,4,0,0,7);ctx.fill();});
  // frosting top + drips
  ctx.fillStyle='#f4eefc';
  ctx.beginPath();ctx.ellipse(200,376,108,18,0,0,7);ctx.fill();
  drips.forEach(d=>{const len=22+d[1]*12+Math.sin(t*1.5+d[0])*2;rr(d[0]-9+ (d[0]>200?25:0)*0,380,18,len,9);ctx.fill();});
  // bottom tier frosting rim
  ctx.fillStyle='#f4eefc';rr(56,424,288,12,6);ctx.fill();
  [80,125,185,215,275,320].forEach((x,i)=>{rr(x-8,430,16,16+(i%2)*10,8);ctx.fill();});
  // sheen
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(170,372,60,6,0,0,7);ctx.fill();
  // berries
  berries.forEach(berry);
}

function digits(t){
  ctx.font='900 94px "Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  [['1',166],['9',236]].forEach(([d,x],i)=>{
    const g=ctx.createLinearGradient(0,300,0,380);
    g.addColorStop(0,i?'#ffd1e8':'#bfe6ff');g.addColorStop(1,i?'#ff7ab8':'#4aa8f0');
    ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.strokeText(d,x,378);
    ctx.fillStyle=g;ctx.fillText(d,x,378);
    ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillRect(x-18,0,0,0);
    // wick
    const wx=x+(d==='1'?-4:0),wy=303;
    ctx.strokeStyle='#3a2a2a';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(wx,wy+6);ctx.lineTo(wx,wy-5);ctx.stroke();
    if(lit[i])flame(wx,wy-4,t,i*3.1);
  });
}

function confetti(dt){
  conf.forEach(p=>{
    p.vy+=(p.vy<60?180:0)*dt*(p.vy<0?1:0.2);p.x+=p.vx*dt+Math.sin(p.a)*10*dt;p.y+=p.vy*dt;p.a+=p.va*dt;p.vx*=.99;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle='hsl('+p.hue+',90%,65%)';
    ctx.scale(1,Math.abs(Math.cos(p.a*1.3))+.2);ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
  });
  conf=conf.filter(p=>p.y<580);
  if(conf.length<45)addConf(2);
}

const CANDLES=[{x:162,y:299},{x:236,y:299}];
const lit=[true,true],smoke=[];let outAt=0,msg='Tap the flames to blow them out';
function puff(x,y){for(let k=0;k<9;k++)smoke.push({x:x+(Math.random()-.5)*4,y:y,vx:(Math.random()-.5)*8,vy:-18-Math.random()*14,r:2+Math.random()*2,life:1});}
function snuff(i){if(!lit[i])return;lit[i]=false;puff(CANDLES[i].x,CANDLES[i].y-6);if(!lit[0]&&!lit[1]){outAt=performance.now();msg='Make a wish!';addConf(60,200,330);}else msg='';}
function relight(i){lit[i]=true;msg='';if(env===1)env=0;}
function drawSmoke(dt,now){
  smoke.forEach(s=>{s.x+=s.vx*dt+Math.sin(s.y*.1)*.2;s.y+=s.vy*dt;s.r+=dt*6;s.life-=dt*.55;if(s.life>0){ctx.fillStyle='rgba(220,220,235,'+(s.life*.35)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}});
  for(let k=smoke.length-1;k>=0;k--)if(smoke[k].life<=0)smoke.splice(k,1);
  if(msg){const any=lit[0]||lit[1];ctx.font='700 '+(any?13:22)+'px "Trebuchet MS",Verdana,sans-serif';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillText(msg,200,any?30:40);}
}
const ENV={x:110,y:170,w:180,h:110};
let env=0,envT=0,envPop=0,typed=0,letterLines=[],letterLen=0;
const LF='"Segoe Print","Bradley Hand","Comic Sans MS","Trebuchet MS",cursive';
function heart(x,y,s,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y+s*.35);ctx.bezierCurveTo(x-s,y-s*.5,x-s*1.2,y+s*.7,x,y+s*1.2);ctx.bezierCurveTo(x+s*1.2,y+s*.7,x+s,y-s*.5,x,y+s*.35);ctx.fill();}
function wrapText(txt,maxW){const out=[];let line='';txt.split(' ').forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;});if(line)out.push(line);return out;}
function buildLetter(){
  const L=[];ctx.font='700 24px '+LF;
  const p1=wrapText('Happy birthday to you Angeli',270);
  p1.forEach((s,i)=>L.push({t:s,x:200-ctx.measureText(s).width/2,y:140+i*32,f:'700 24px '+LF,c:'#c2185b'}));
  let y=140+p1.length*32+14;ctx.font='600 18px '+LF;
  const p2=wrapText('I love you for being a good friend for mee and thanks for being there for me, be happy it’s your dayy, and have more birthdays to comee',270);
  p2.forEach((s,i)=>L.push({t:s,x:65,y:y+i*30,f:'600 18px '+LF,c:'#3b2a6e'}));
  y+=p2.length*30+18;ctx.font='700 20px '+LF;const sg='- love lots by Dredree';
  L.push({t:sg,x:335-ctx.measureText(sg).width,y:y,f:'700 20px '+LF,c:'#c2185b'});
  letterLines=L;letterLen=L.reduce((a,l)=>a+l.t.length,0);
}
function drawCard(x,y,w,h){ctx.save();ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=20;ctx.fillStyle='#fffaf0';rr(x,y,w,h,10);ctx.fill();ctx.restore();ctx.strokeStyle='#e8d5b0';ctx.lineWidth=3;rr(x+6,y+6,w-12,h-12,8);ctx.stroke();}
function envBody(x,y,w,h,a,ly){
  ctx.fillStyle='#d9c398';rr(x,y,w,h,8);ctx.fill();
  const tip=y+h*.55*Math.cos(a*Math.PI);
  const flap=c=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w/2,tip);ctx.closePath();ctx.fill();};
  if(a>.5)flap('#c9b184');
  if(ly!=null){ctx.fillStyle='#fffaf0';rr(x+12,ly,w-24,h-14,4);ctx.fill();ctx.fillStyle='#e8c9d4';for(let k=0;k<4;k++)ctx.fillRect(x+24,ly+14+k*10,w-48,2);}
  ctx.save();rr(x,y,w,h,8);ctx.clip();
  ctx.fillStyle='#efdfbe';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+w/2,y+h*.55);ctx.lineTo(x,y+h);ctx.fill();
  ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w/2,y+h*.55);ctx.lineTo(x+w,y+h);ctx.fill();
  ctx.fillStyle='#e6d3ab';ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x+w/2,y+h*.5);ctx.lineTo(x+w,y+h);ctx.fill();
  ctx.restore();
  if(a<=.5)flap('#f3e5c6');
  if(a<.05)heart(x+w/2,y+h*.55-10,9,'#e53979');
}
function envTap(x,y){
  if(env===3){env=0;lit[0]=lit[1]=true;msg='';return true;}
  if(env===2)return true;
  if(env===1&&x>ENV.x-10&&x<ENV.x+ENV.w+10&&y>ENV.y-10&&y<ENV.y+ENV.h+10){env=2;envT=0;msg='';return true;}
  return false;
}
function drawEnv(dt,now){
  if(env===0&&!lit[0]&&!lit[1]&&now-outAt>1200){env=1;envPop=0;msg='A letter for you - tap to open';}
  if(env===0)return;
  const E=ENV,ez=v=>1-Math.pow(1-v,3);
  if(env===1){
    envPop=Math.min(1,envPop+dt*2.5);const sc=.6+.4*ez(envPop),bob=Math.sin(now/400)*3;
    ctx.save();ctx.globalAlpha=envPop;ctx.translate(E.x+E.w/2,E.y+E.h/2+bob);ctx.scale(sc,sc);ctx.translate(-E.w/2,-E.h/2);
    envBody(0,0,E.w,E.h,0,null);ctx.restore();return;
  }
  if(env===2){
    envT=Math.min(1,envT+dt/1.8);const p=envT;
    const a=Math.min(1,p/.3),q=ez(Math.max(0,Math.min(1,(p-.3)/.35))),r=ez(Math.max(0,Math.min(1,(p-.7)/.3)));
    const ly=E.y+14-q*80;
    if(r>0){ctx.fillStyle='rgba(10,5,40,'+(r*.82)+')';ctx.fillRect(-300,-300,1000,1200);}
    envBody(E.x,E.y,E.w,E.h,a,r>0?null:ly);
    if(r>0){const L=(a0,b)=>a0+(b-a0)*r;drawCard(L(E.x+12,40),L(ly,60),L(E.w-24,320),L(E.h-14,420));}
    if(p>=1){env=3;typed=0;buildLetter();}
    return;
  }
  ctx.fillStyle='rgba(10,5,40,.82)';ctx.fillRect(-300,-300,1000,1200);
  drawCard(40,60,320,420);heart(200,86,10,'#ff5d8f');
  typed=Math.min(letterLen,typed+dt*38);let n=Math.floor(typed);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  for(const l of letterLines){if(n<=0)break;ctx.font=l.f;ctx.fillStyle=l.c;ctx.fillText(l.t.slice(0,n),l.x,l.y);n-=l.t.length;}
  if(typed>=letterLen){ctx.font='italic 12px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillStyle='rgba(60,40,110,.6)';ctx.fillText('tap anywhere to close',200,462);}
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1a1440');bg.addColorStop(1,'#4a2f7d');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{ctx.globalAlpha=.4+.6*Math.abs(Math.sin(t*1.2+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,7);ctx.fill();});
  ctx.globalAlpha=1;
  ctx.setTransform(dpr*S,0,0,dpr*S,dpr*ox,dpr*oy);
  rainbowBands(t);
  cake(t);
  digits(t);
  drawSmoke(dt,now);
  arcText('happy birthday angeli!',t);
  confetti(dt);
  ctx.font='italic 600 14px "Trebuchet MS",Verdana,sans-serif';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.fillText('Made with love by Andre',200,550);
  drawEnv(dt,now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
